[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-crop-copilot"
version = "0.1.0"
description = "Field-condition crop diagnosis with grounded multilingual advice and human review"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "Pillow>=10.4,<12",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "timm>=1.0,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
train = ["mlflow>=2.15,<4", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
speech = ["faster-whisper>=1.0,<2", "gTTS>=2.5,<3"]
mlops = ["dvc>=3.50,<4", "mlflow>=2.15,<4"]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
