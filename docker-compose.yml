services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro

  farmer-ui:
    build: .
    env_file: .env
    command: streamlit run src/crop_copilot/ui/farmer_app.py --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    depends_on:
      - api

  reviewer-ui:
    build: .
    env_file: .env
    command: streamlit run src/crop_copilot/ui/reviewer_app.py --server.address 0.0.0.0 --server.port 8502
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8502:8502"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    depends_on:
      - api
